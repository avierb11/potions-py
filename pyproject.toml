[project]
name = "potions"
version = "0.1.0"
description = "Pure Python + PyTorch re-implementation of the potions hydrology / reactive-transport ODE model, with batched parameter sets, autograd Jacobians, and GPU support."
readme = "PLAN.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "potions-py" }]

dependencies = [
    "torch>=2.1",
    "numpy>=1.26",
    "pandas>=2.0",
    "pydantic>=2.5",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/potions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["potions"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
enable_error_code = ["ignore-without-code"]

[[tool.mypy.overrides]]
# scipy ships no type stubs; mark the import as untyped (values still typed by us).
module = ["scipy", "scipy.*"]
ignore_missing_imports = true
